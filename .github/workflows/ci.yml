name: CI

on:
  push:
    branches: [main, feat/v1.2-product]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Ruff lint & format check
        run: |
          uvx ruff==0.17.0 check src tests eval
          uvx ruff==0.17.0 format --check src tests eval

      - name: TypeScript typecheck & Vite production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  test:
    name: Pytest, Alembic & Offline Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Verify Alembic migrations
        run: DATABASE_URL=sqlite:////tmp/ci_alembic.sqlite3 uv run alembic upgrade head

      - name: Run pytest suite
        run: uv run pytest -q

      - name: Run 30-scenario stateful evaluation (offline)
        run: uv run python eval/run_eval.py --scenarios eval/scenarios.jsonl --out /tmp/ci-eval --llm-mode offline
