<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Astropilote — Soutenance (Albert School &amp; Mines Paris - PSL)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
<style>
  :root{
    --bg:#0b0d12; --white:#F2F3F5; --greyB:#B9BEC7; --grey:#8A8F98; --greyD:#2A2F3A;
    --blue:#58C4DD; --blueD:#29ABCA; --blueE:#1C758A; --teal:#5CD0B3; --green:#83C167;
    --gold:#F0AC5F; --yellow:#FFE14D; --red:#FC6255; --maroon:#C55F73; --purple:#B07CC6;
    --serif:"Computer Modern Serif","Latin Modern Roman","CMU Serif","Georgia","Times New Roman",serif;
    --mono:"Computer Modern Typewriter","Latin Modern Mono","CMU Typewriter Text","Menlo","Consolas",monospace;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--serif)}
  #viewport{position:fixed;inset:0;background:#000}
  #stage{position:absolute;left:calc(50% - 960px);top:calc(50% - 540px);width:1920px;height:1080px;
         transform-origin:50% 50%;background:var(--bg);overflow:hidden}
  #layer{position:absolute;inset:0}
  .slide{position:absolute;inset:0}
  svg.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
  svg text{font-family:var(--serif)}
  svg text.halo{paint-order:stroke;stroke:#0b0d12;stroke-width:7px;stroke-linejoin:round}
  .t{position:absolute;color:var(--white);line-height:1.3;white-space:normal}
  .title{font-size:54px;letter-spacing:.2px;line-height:1.15}
  .title .num{color:var(--grey);font-size:30px;margin-right:22px;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .mono{font-family:var(--mono)}
  .star{animation:tw var(--tw) ease-in-out infinite alternate}
  @keyframes tw{from{opacity:calc(var(--o) * .3)} to{opacity:var(--o)}}
  #hud{position:absolute;inset:0;pointer-events:none}
  #counter{position:absolute;right:48px;bottom:30px;font-size:20px;color:var(--grey);font-variant-numeric:tabular-nums;letter-spacing:1px}
  #bar{position:absolute;left:0;bottom:0;height:3px;background:var(--blue);width:0;transition:width .4s ease}
  #help{position:absolute;left:48px;bottom:30px;font-size:19px;color:var(--grey);transition:opacity 1s}
  #notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:rgba(10,12,18,.94);
         color:#e6e8ee;border-top:1px solid #2a2f3a;padding:18px 36px;font-size:17px;line-height:1.5;
         display:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #notes b{color:var(--gold)} #notes .who{color:var(--teal)} #notes .tm{color:var(--grey);margin-left:10px}
  i.m{font-style:italic;font-family:var(--serif)}
  .frac{display:inline-block;vertical-align:middle;text-align:center;line-height:1.05;margin:0 6px}
  .frac span{display:block;padding:0 6px}
  .frac span:first-child{border-bottom:2px solid currentColor}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="layer"></div>
    <div id="hud"><div id="counter"></div><div id="bar"></div>
      <div id="help">←  →  navigate  ·  N speaker notes  ·  F fullscreen</div></div>
  </div>
</div>
<div id="notes"></div>
<script>
'use strict';
/* ============================================================
   Astropilote — Manim-inspired HTML/SVG presentation deck.
   Fixed 1920×1080 stage (auto-scaled to viewport); each slide
   is a JS scene with step-by-step (→) animations.
   ============================================================ */
const W=1920,H=1080;
const C={bg:'#0b0d12',white:'#F2F3F5',greyB:'#B9BEC7',grey:'#8A8F98',greyD:'#2A2F3A',
  blue:'#58C4DD',blueD:'#29ABCA',blueE:'#1C758A',teal:'#5CD0B3',green:'#83C167',
  gold:'#F0AC5F',yellow:'#FFE14D',red:'#FC6255',maroon:'#C55F73',purple:'#B07CC6'};
const CONFIG={
  team:['Guillaume','Amandine','Alessandro','Charles','Louis'],   // ← edit first names here if needed
  lead:'Guillaume',
  course:'Generative AI I  ·  Albert School & Mines Paris - PSL  ·  2026',
  wip:false   // all 5 team modules are completed, tested, and integrated on main
};

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const fr=(v,d=1)=>v.toFixed(d);
const NS='http://www.w3.org/2000/svg';
function S(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs){if(attrs[k]!==undefined&&attrs[k]!==null)e.setAttribute(k,attrs[k]);}if(parent)parent.appendChild(e);return e;}
function T(parent,x,y,str,o={}){
  const t=S('text',{x,y,'font-size':o.size||28,fill:o.fill||C.white,'text-anchor':o.anchor||'start',
    'dominant-baseline':o.base||'middle','font-family':o.mono?'var(--mono)':'var(--serif)',
    'font-style':o.italic?'italic':'normal','font-weight':o.bold?'bold':'normal',opacity:o.show?1:0,class:o.halo?'halo':null},parent);
  t.textContent=str;return t;}
function TL(parent,x,y,lines,o={}){const t=T(parent,x,y,'',o);const lh=o.lh||((o.size||28)*1.3);
  lines.forEach((l,i)=>{const ts=S('tspan',{x,dy:i?lh:0},t);ts.textContent=l;});return t;}
function D(parent,html,st={},cls=''){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;Object.assign(d.style,st);parent.appendChild(d);return d;}
function P(parent,x,y,w,html,o={}){return D(parent,html,{position:'absolute',left:x+'px',top:y+'px',width:w+'px',
  fontSize:(o.size||28)+'px',color:o.color||C.white,textAlign:o.align||'left',
  fontFamily:o.mono?'var(--mono)':'var(--serif)',fontStyle:o.italic?'italic':'normal',
  lineHeight:o.lh||1.3,opacity:o.show?1:0},'t');}
function title(s,num,text){const d=P(s.html,100,62,1720,`<span class="num">${num}</span>${text}`,{size:54});d.classList.add('title');write(d,{d:900});return d;}
function cap(s,html,o={}){return P(s.html,100,o.y||955,1720,html,{size:o.size||30,color:o.color||C.greyB,align:'center',italic:o.italic});}
function tag(s,text,col){return P(s.html,1120,84,700,text,{size:21,color:col||C.teal,align:'right',italic:true,show:true});}
function card(parent,x,y,w,h,o={}){
  const d=D(parent,'',{position:'absolute',left:x+'px',top:y+'px',width:w+'px',height:h?h+'px':'auto',boxSizing:'border-box',
    border:`2px solid ${o.stroke||C.greyB}`,borderRadius:'14px',padding:o.pad||'14px 20px',background:o.bg||'rgba(255,255,255,0.025)',
    opacity:o.show?1:0,fontFamily:'var(--serif)',color:C.white,overflow:'hidden'});
  if(o.title)D(d,o.title,{fontSize:(o.titleSize||26)+'px',color:o.titleColor||C.white,marginBottom:'8px'});
  if(o.body)D(d,o.body,{});return d;}
function box(parent,cx,cy,w,h,o={}){
  const g=S('g',{opacity:o.show?1:0},parent);
  const r=S('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:o.rx??16,fill:o.fill||'rgba(255,255,255,0.03)',stroke:o.stroke||C.greyB,'stroke-width':o.sw||2.5},g);
  const lines=o.label?[o.label].flat():[];const sub=o.sub?[o.sub].flat():[];const size=o.size||28,ss=o.subSize||20;
  const total=lines.length*size*1.2+(sub.length?sub.length*ss*1.3+8:0);let y=cy-total/2+size*0.6;
  lines.forEach(l=>{T(g,cx,y,l,{size,fill:o.color||C.white,anchor:'middle',show:true,bold:o.bold});y+=size*1.2;});
  if(sub.length){y+=4;sub.forEach(l=>{T(g,cx,y,l,{size:ss,fill:o.subColor||C.grey,anchor:'middle',show:true});y+=ss*1.3;});}
  g.rect=r;return g;}
function arrow(parent,d,o={}){
  const g=S('g',{opacity:o.show?1:0},parent);
  const p=S('path',{d,fill:'none',stroke:o.color||C.greyB,'stroke-width':o.sw||3,'stroke-linecap':'round','stroke-dasharray':o.dash},g);
  const L=p.getTotalLength();const hs=o.head??14;
  function headAt(len,dir){const a=p.getPointAtLength(len),b=p.getPointAtLength(Math.max(0,Math.min(L,len-dir*3)));
    const ang=Math.atan2(a.y-b.y,a.x-b.x);
    const pts=[[2,0],[-hs,hs*0.55],[-hs,-hs*0.55]].map(([x,y])=>(a.x+x*Math.cos(ang)-y*Math.sin(ang))+','+(a.y+x*Math.sin(ang)+y*Math.cos(ang))).join(' ');
    return S('polygon',{points:pts,fill:o.color||C.greyB},g);}
  g.path=p;g.head=headAt(L,1);if(o.bidir)g.head2=headAt(0,-1);return g;}
const CLOUD='M10,55 H85 C100,55 105,40 95,32 C100,15 80,8 70,15 C62,0 38,2 35,16 C20,12 8,25 15,38 C2,40 0,55 10,55 Z';
function icon(parent,name,x,y,color){const g=S('g',{},parent);
  if(name==='clock'){S('circle',{cx:x,cy:y,r:18,fill:'none',stroke:color,'stroke-width':2.5},g);S('path',{d:`M${x} ${y-10} V${y} H${x+8}`,fill:'none',stroke:color,'stroke-width':2.5,'stroke-linecap':'round'},g);}
  else if(name==='pin'){S('path',{d:`M${x} ${y+18} C${x-14} ${y+2} ${x-17} ${y-6} ${x-17} ${y-11} A17 17 0 1 1 ${x+17} ${y-11} C${x+17} ${y-6} ${x+14} ${y+2} ${x} ${y+18} Z`,fill:'none',stroke:color,'stroke-width':2.5},g);S('circle',{cx:x,cy:y-11,r:5,fill:color},g);}
  else if(name==='cloud'){S('path',{d:CLOUD,transform:`translate(${x-52} ${y-28})`,fill:'none',stroke:color,'stroke-width':2.5,'stroke-linejoin':'round'},g);}
  return g;}
function starfield(svg,n,seed){const rnd=mulberry32(seed);const g=S('g',{opacity:0},svg);
  for(let i=0;i<n;i++){const c=S('circle',{cx:rnd()*W,cy:rnd()*H,r:0.5+rnd()*1.5,fill:'#fff',class:'star'},g);
    c.style.setProperty('--tw',(2.5+rnd()*4).toFixed(2)+'s');c.style.animationDelay=(-rnd()*6).toFixed(2)+'s';c.style.setProperty('--o',(0.2+rnd()*0.6).toFixed(2));}
  return g;}

/* ---------- animation engine ---------- */
let INSTANT=false;
const ticks=[];let rafId=null;
function loop(now){for(let i=ticks.length-1;i>=0;i--){const t=ticks[i];if(now<t.t0)continue;let p=(now-t.t0)/t.d;
    if(t.loop){p=p%1;}else if(p>=1){p=1;}t.fn(p);if(p>=1&&!t.loop)ticks.splice(i,1);}
  rafId=ticks.length?requestAnimationFrame(loop):null;}
function tick(fn,d,o={}){if(INSTANT){fn(1);return;}ticks.push({fn,t0:performance.now()+(o.delay||0),d,loop:o.loop});if(!rafId)rafId=requestAnimationFrame(loop);}
function clearTicks(){ticks.length=0;}
function anim(el,kf,o={}){const a=el.animate(kf,{duration:o.d??700,delay:o.delay??0,easing:o.ease??'cubic-bezier(.45,0,.2,1)',fill:o.fill??'forwards'});if(INSTANT)a.finish();return a;}
function fade(el,o={}){const kf=[{opacity:o.from??0},{opacity:o.to??1}];if(o.dy){kf[0].transform=`translateY(${o.dy}px)`;kf[1].transform='translateY(0px)';}return anim(el,kf,o);}
function hide(el,o={}){return anim(el,[{opacity:1},{opacity:0}],{d:o.d??400,...o});}
function write(el,o={}){el.style.opacity=1;return anim(el,[{clipPath:'inset(-30% 100% -30% -4%)'},{clipPath:'inset(-30% -4% -30% -4%)'}],{d:o.d??800,ease:'cubic-bezier(.3,0,.3,1)',fill:'both',...o});}
function draw(p,o={}){let L=1000;try{L=p.getTotalLength();}catch(e){}p.style.strokeDasharray=L+' '+L;p.style.strokeDashoffset=L;p.setAttribute('opacity',1);p.style.opacity=1;
  return anim(p,[{strokeDashoffset:L},{strokeDashoffset:0}],{d:o.d??900,...o});}
function showArrow(a,o={}){a.setAttribute('opacity',1);const d=o.d??700,delay=o.delay||0;a.head.setAttribute('opacity',0);if(a.head2)a.head2.setAttribute('opacity',0);
  if(a.path.getAttribute('stroke-dasharray')){a.path.setAttribute('opacity',0);fade(a.path,{d,delay});}else draw(a.path,{d,delay});
  fade(a.head,{d:250,delay:delay+d-120});if(a.head2)fade(a.head2,{d:250,delay:delay+d-120});}
function count(el,to,o={}){const from=o.from??0,fmt=o.fmt??(v=>Math.round(v));if(INSTANT){el.textContent=fmt(to);return;}
  tick(p=>{const e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);},o.d??1200,{delay:o.delay||0});}
function moveAlong(dot,path,o={}){const L=path.getTotalLength();if(INSTANT){dot.setAttribute('opacity',0);if(o.onP)o.onP(1,path.getPointAtLength(L));return;}
  dot.setAttribute('opacity',0);
  tick(p=>{dot.setAttribute('opacity',1);const e=o.linear?p:(p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2);const pt=path.getPointAtLength(L*e);
    dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);if(o.onP)o.onP(e,pt);if(p>=1&&!o.loop)dot.setAttribute('opacity',0);},o.d??3000,{delay:o.delay||0,loop:o.loop});}
function growBar(rect,baseY,hFinal,o={}){const x=+rect.getAttribute('x'),w=+rect.getAttribute('width');rect.setAttribute('opacity',1);
  tick(p=>{const e=1-Math.pow(1-p,3);const h=hFinal*e;rect.setAttribute('y',baseY-h);rect.setAttribute('height',h);},o.d??900,{delay:o.delay||0});}
function growBarH(rect,x0,wFinal,o={}){rect.setAttribute('opacity',1);tick(p=>{const e=1-Math.pow(1-p,3);rect.setAttribute('width',wFinal*e);},o.d??900,{delay:o.delay||0});}

/* ---------- navigation ---------- */
const slides=[];function slide(def){slides.push(def);}
const layer=document.getElementById('layer'),stage=document.getElementById('stage');
let cur={i:0,step:0},built=null;
function render(i,step,live){
  clearTicks();layer.innerHTML='';
  const root=D(layer,'',{},'slide');const svg=S('svg',{viewBox:`0 0 ${W} ${H}`,class:'layer'},root);
  const html=D(root,'',{position:'absolute',inset:'0'});const s={root,svg,html,defs:S('defs',{},svg)};
  INSTANT=!(live&&step===0);
  const def=slides[i];const ctrl=def.build(s);ctrl.steps=ctrl.steps||[];built={s,ctrl};
  if(step==='all')step=ctrl.steps.length;step=Math.min(step,ctrl.steps.length);
  INSTANT=!(live&&step===0);if(ctrl.enter)ctrl.enter();
  for(let k=0;k<step;k++){INSTANT=!(live&&k===step-1);ctrl.steps[k]();}
  INSTANT=false;cur={i,step};hud();
  document.getElementById('notes').innerHTML=`<b>${String(i+1).padStart(2,'0')} — ${def.name||def.id}</b> ${def.notes||''}`;
  history.replaceState(null,'',`#${i+1}.${step}`);
}
function hud(){document.getElementById('counter').textContent=`${String(cur.i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;
  document.getElementById('bar').style.width=((cur.i+1)/slides.length*100)+'%';}
function next(){const n=built.ctrl.steps.length;if(cur.step<n){INSTANT=false;built.ctrl.steps[cur.step]();cur.step++;history.replaceState(null,'',`#${cur.i+1}.${cur.step}`);}
  else if(cur.i<slides.length-1)render(cur.i+1,0,true);}
function prev(){if(cur.step>0)render(cur.i,cur.step-1,false);else if(cur.i>0)render(cur.i-1,'all',false);}
function fit(){const sc=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`scale(${sc})`;}
addEventListener('resize',fit);
addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
  else if(k==='Home')render(0,0,false);else if(k==='End')render(slides.length-1,'all',false);
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(k==='n'||k==='N'){const n=document.getElementById('notes');n.style.display=n.style.display==='block'?'none':'block';}
  else if(k==='r'||k==='R')render(cur.i,cur.step,true);});
addEventListener('click',e=>{if(e.target.closest('#notes'))return;(e.clientX<innerWidth/3)?prev():next();});
window.goto=(i,k)=>render(i,k,false);window.stepCount=(i)=>{render(i,0,false);return built.ctrl.steps.length;};

/* ============================================================ SLIDES */

/* 01 — Title */
slide({id:'titre',name:'Title',
 notes:`<span class="who">Speaker: Charles (pitch)</span> — “Astropilote answers the question every amateur astrophotographer asks: <b>what should I image tonight, from here, with my gear?</b>” It doesn’t guess: it computes the sky, retrieves the right catalog cards, and verifies what it says.`,
 build(s){
  const stars=starfield(s.svg,190,7);
  const cas=[[1235,235],[1330,330],[1440,290],[1535,335],[1640,235]];
  const and=[[1190,560],[1290,600],[1400,650],[1520,700]];
  const g=S('g',{},s.svg);
  const lines=[];
  const mk=(pts,col)=>{for(let i=0;i<pts.length-1;i++)lines.push(S('line',{x1:pts[i][0],y1:pts[i][1],x2:pts[i+1][0],y2:pts[i+1][1],stroke:col,'stroke-width':2,opacity:0},g));};
  mk(cas,C.blueD);mk(and,C.blueD);
  lines.push(S('line',{x1:1400,y1:650,x2:1345,y2:520,stroke:C.gold,'stroke-width':2,'stroke-dasharray':'6 8',opacity:0},g));
  const m31=S('ellipse',{cx:1340,cy:512,rx:40,ry:15,transform:'rotate(-35 1340 512)',fill:C.gold,'fill-opacity':.25,stroke:C.gold,'stroke-width':1.5,opacity:0},g);
  const m31l=T(g,1395,500,'M31',{size:22,fill:C.gold});
  const dots=[...cas,...and].map(([x,y])=>{const gg=S('g',{opacity:0},g);S('circle',{cx:x,cy:y,r:11,fill:'#fff','fill-opacity':.1},gg);S('circle',{cx:x,cy:y,r:4.2,fill:'#fff'},gg);return gg;});
  const casL=T(g,1440,195,'Cassiopeia',{size:22,fill:C.grey,anchor:'middle'});
  const andL=T(g,1520,748,'Andromeda',{size:22,fill:C.grey,anchor:'middle'});
  const t1=P(s.html,120,340,980,'Astropilote',{size:128,lh:1.1});
  const t2=P(s.html,124,500,980,'An AI copilot for astrophotography',{size:40,color:C.greyB});
  const t3=P(s.html,124,578,980,'It <span style="color:'+C.gold+'">computes</span> the sky, <span style="color:'+C.teal+'">retrieves</span> the catalog, and <span style="color:'+C.green+'">verifies</span> every number.',{size:28,color:C.grey,italic:true});
  const team=P(s.html,124,865,1200,CONFIG.team.join('  ·  '),{size:27,color:C.greyB});
  const course=P(s.html,124,915,1200,CONFIG.course,{size:22,color:C.grey});
  return {
   enter(){fade(stars,{d:1800});dots.forEach((d,i)=>fade(d,{d:500,delay:300+i*120}));
     lines.forEach((l,i)=>draw(l,{d:450,delay:500+i*160}));fade(m31,{d:800,delay:2200});fade(m31l,{d:600,delay:2400});
     fade(casL,{d:600,delay:1200});fade(andL,{d:600,delay:1900});
     fade(t1,{d:900,delay:200,dy:10});fade(t2,{d:800,delay:700,dy:10});fade(t3,{d:800,delay:1100,dy:10});
     fade(team,{d:700,delay:1400});fade(course,{d:700,delay:1600});},
   steps:[]
  };
 }});

/* 02 — The starting question */
slide({id:'question',name:'The starting question',
 notes:`<span class="who">Charles</span> — A beginner’s question sounds simple, but it hides <b>three different kinds of answers</b>: a geometric calculation (where is the object?), live data (dark sky window, Moon, weather), and optical physics (does my gear fit the target?).`,
 build(s){
  title(s,'01','A deceptively simple question');
  const q=P(s.html,160,210,1600,'“What can I photograph tonight?”',{size:62,align:'center'});
  const cols=[];
  {const g=S('g',{opacity:0},s.svg);
   S('line',{x1:190,y1:640,x2:610,y2:640,stroke:C.grey,'stroke-width':2},g);
   const arc=S('path',{d:'M230 640 A170 170 0 0 1 570 640',fill:'none',stroke:C.gold,'stroke-width':2.5,'stroke-dasharray':'2 9'},g);
   const vl=S('line',{x1:400,y1:640,x2:400,y2:640,stroke:C.gold,'stroke-width':1.5,'stroke-dasharray':'5 6'},g);
   const dot=S('circle',{cx:230,cy:640,r:9,fill:C.gold,opacity:0},g);
   T(g,222,668,'rise',{size:19,fill:C.grey,anchor:'middle',show:true});T(g,578,668,'set',{size:19,fill:C.grey,anchor:'middle',show:true});
   const hl=T(g,0,0,'altitude',{size:19,fill:C.gold,anchor:'start'});
   cols.push({g,run(){moveAlong(dot,arc,{d:5200,loop:true,linear:true,onP:(p,pt)=>{vl.setAttribute('x1',pt.x);vl.setAttribute('x2',pt.x);vl.setAttribute('y1',pt.y);
