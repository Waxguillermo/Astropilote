services:
  # Default solo local mode: zero login, SQLite WAL volume, connects to host Ollama ($0)
  astropilote:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUTH_MODE: local
      LLM_MODE: ${LLM_MODE:-local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASTROMETRY_API_KEY: ${ASTROMETRY_API_KEY:-}
      UVICORN_WORKERS: 1
    volumes:
      - astropilote_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Cloud multi-user BYOK profile: `docker compose --profile cloud up --build`
  postgres:
    image: postgres:16-alpine
    profiles: ["cloud"]
    environment:
      POSTGRES_DB: astropilote
      POSTGRES_USER: astropilote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-only}
    volumes:
      - astropilote_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astropilote"]
      interval: 5s
      timeout: 3s
      retries: 10

  astropilote-cloud:
    build: .
    profiles: ["cloud"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      AUTH_MODE: cloud
      LLM_MODE: api
      DATABASE_URL: postgresql+psycopg://astropilote:${POSTGRES_PASSWORD:-changeme-dev-only}@postgres:5432/astropilote
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY (>= 32 chars) for cloud mode}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-30}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    volumes:
      - astropilote_data:/app/data

volumes:
  astropilote_data:
  astropilote_pg:
