[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astropilote"
version = "1.0.0"
description = "Open-source Hybrid RAG & Stateful MCP Agent for Astronomy Planning and Remote Observatories."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [
    { name = "AstroPilote — Albert School × Mines Paris – Generative AI I" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "bm25s>=0.2.0",
    "numpy>=1.26.0",
    "skyfield>=1.49",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "astropy>=6.0.0",
    "pillow>=10.0.0",
    "timezonefinder>=6.5.0",
    "langgraph>=0.2.0",
    "mcp>=2,<3",
    "langgraph-checkpoint-sqlite>=3,<4",
    "arize-phoenix-otel>=0.17.3",
    "openinference-instrumentation-anthropic>=3.3.7",
    "openinference-instrumentation-langchain>=0.1.88",
    "openinference-semantic-conventions>=0.1.46",
    "fastembed>=0.9.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "cryptography>=44.0.0",
    "pyjwt>=2.10.0",
]

[project.scripts]
astropilote-mcp = "astropilote.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "nbformat>=5.10.0",
]
opt = [
    "gepa>=0.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astropilote"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
