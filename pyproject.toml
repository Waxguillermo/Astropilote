[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astropilote"
version = "1.0.0"
description = "Google ADK & Hybrid RAG agentic copilot for visual astronomy and astrophotography session planning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AstroPilote Team — ENPC Generative AI I" }
]
dependencies = [
    # Core schemas & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    # Agent orchestration (Google Agent Development Kit — ADK + LiteLLM for local Gemma 4 / Ollama)
    "google-adk>=1.0.0",
    "litellm>=1.60.0",
    # Hybrid Retrieval (BM25 + Dense Vectors + Cross-Encoder Reranking)
    "bm25s>=0.2.0",
    "sentence-transformers>=3.1.0",
    "qdrant-client>=1.11.0",
    "numpy>=1.26.0",
    # Astronomical ephemerides & external data tools
    "skyfield>=1.49",
    "httpx>=0.27.0",
    # Backend & Interactive Agentic UI (FastAPI + Custom Observatory UI + Chainlit)
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "chainlit>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astropilote"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
