[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astropilote"
version = "1.0.0"
description = "Open-source Hybrid RAG & Agentic Copilot for Visual Astronomy and Astrophotography."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AstroPilote — ENPC Generative AI I" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    # LLM Providers: Anthropic API + Local Ollama (via httpx)
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    # Hybrid Retrieval (BM25 + Qdrant Dense + Cross-Encoder Reranker)
    "bm25s>=0.2.0",
    "sentence-transformers>=3.1.0",
    "qdrant-client>=1.11.0",
    "numpy>=1.26.0",
    # Astronomical Ephemerides
    "skyfield>=1.49",
    # Web Backend & Sky Vision
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pillow>=10.0.0",
    "astropy>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "nbformat>=5.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astropilote"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
